name: Deploy Frontend

# Only fires on pushes that land on dev — i.e. after a merge. Pushes to
# feature branches never trigger a deploy.
#
# Runs on a self-hosted runner installed directly on the target server
# (see ~/actions-runner-fe there). GitHub-hosted runners' IPs get silently
# dropped by this server's network before reaching SSH, so the deploy
# has to run locally instead of connecting in over SSH.
on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to deploy directory
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            "$GITHUB_WORKSPACE"/ ~/apps/usratul-azkaar-fe/

      - name: Rebuild and restart frontend
        run: |
          cd ~/apps/usratul-azkaar-be
          docker compose up -d --build frontend
          docker image prune -f
